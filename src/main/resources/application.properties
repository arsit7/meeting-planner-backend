spring.application.name=meeting-planner
server.port=8080

# Optional, git-ignored local overrides (e.g. a development JWT secret).
spring.config.import=optional:file:./config/application-local.properties

# ---- Database: file-based H2, persisted in ./data (git-ignored) ----
spring.datasource.url=jdbc:h2:file:./data/meetingplanner;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ---- JWT ----
# REQUIRED: supply via the JWT_SECRET environment variable or config/application-local.properties.
# Must be at least 32 bytes. The application refuses to start without it.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

# ---- CORS: local frontend only ----
app.cors.allowed-origins=http://localhost:5173

# ---- Avatar uploads: stored outside the source tree in ./uploads (git-ignored) ----
app.storage.avatar-dir=./uploads/avatars
app.storage.max-avatar-bytes=2097152
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---- Error responses: never leak internals ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
