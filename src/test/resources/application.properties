spring.application.name=meeting-planner-test

# Isolated in-memory database: tests never touch local ./data
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test-only signing key (not used anywhere outside the test suite)
app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
app.jwt.expiration-minutes=60

app.cors.allowed-origins=http://localhost:5173

app.storage.avatar-dir=./target/test-uploads/avatars
app.storage.max-avatar-bytes=2097152
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

server.error.include-stacktrace=never
